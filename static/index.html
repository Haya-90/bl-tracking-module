<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BL Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F7; --surface:#FFFFFF; --ink:#101B2D; --ink-soft:#5B6B80; --line:#E2E7EB;
    --sea:#0E7A78; --sea-bg:#E7F3F2; --air:#3457D5; --air-bg:#EAEFFC;
    --amber:#B9791A; --amber-bg:#FBF1DF; --green:#1E8E5A; --green-bg:#E7F5EC;
    --violet:#6957C9; --violet-bg:#EEEBFA; --red:#B23A2E; --red-bg:#FBEAE8;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--sea),var(--air));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;flex-shrink:0;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.01em;margin:0;}
  .subtitle{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .live-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--green);font-weight:600;margin-left:8px;}
  .live-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);}
  .new-btn{background:var(--ink);color:#fff;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;padding:11px 18px;cursor:pointer;white-space:nowrap;}
  .new-btn:hover{background:#26324a;}
  .stats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:104px;}
  .stat .num{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:20px;line-height:1;}
  .stat .lbl{font-size:11.5px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
  .stat.booked .num{color:var(--violet);} .stat.transit .num{color:var(--amber);}
  .stat.arrived .num{color:var(--air);} .stat.delivered .num{color:var(--green);}
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .filters select, .filters input{font-family:'Inter',sans-serif;font-size:13px;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;outline:none;}
  .filters input{flex:1;min-width:180px;}
  .list{display:flex;flex-direction:column;gap:8px;}
  .row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:180px 1fr 132px;gap:14px;align-items:center;transition:border-color .12s ease, box-shadow .12s ease;}
  .row:hover{border-color:#c7cfd8;box-shadow:0 2px 10px rgba(16,27,45,0.05);}
  .row-id{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .bl-num{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px;letter-spacing:-0.01em;}
  .row-meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);}
  .mode-chip{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:10.5px;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.03em;}
  .mode-chip.sea{background:var(--sea-bg);color:var(--sea);} .mode-chip.air{background:var(--air-bg);color:var(--air);}
  .route{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .route-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .route-labels b{color:var(--ink);font-weight:600;}
  .track{position:relative;height:18px;}
  .track-line{position:absolute;top:8px;left:0;right:0;height:2px;background:var(--line);border-radius:2px;}
  .track-fill{position:absolute;top:8px;left:0;height:2px;border-radius:2px;background:var(--ink-soft);}
  .track-fill.sea{background:var(--sea);} .track-fill.air{background:var(--air);}
  .track-dot{position:absolute;top:4px;width:8px;height:8px;border-radius:50%;background:var(--line);border:2px solid var(--surface);}
  .track-dot.origin{left:-3px;background:var(--ink-soft);} .track-dot.dest{right:-3px;background:var(--ink-soft);}
  .track-mover{position:absolute;top:-2px;transform:translateX(-50%);font-size:13px;transition:left .3s ease;}
  .track.cancelled .track-fill{background:var(--red);opacity:.55;}
  .row-status{display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .badge.booked{background:var(--violet-bg);color:var(--violet);} .badge.in_transit{background:var(--amber-bg);color:var(--amber);}
  .badge.arrived{background:var(--air-bg);color:var(--air);} .badge.delivered{background:var(--green-bg);color:var(--green);}
  .badge.cancelled{background:var(--red-bg);color:var(--red);}
  .transit-label{font-size:11px;color:var(--ink-soft);text-align:right;}
  .empty, .loading{text-align:center;padding:48px 20px;color:var(--ink-soft);font-size:13.5px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:all .2s ease;z-index:40;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:var(--red);}
  .scrim{position:fixed;inset:0;background:rgba(16,27,45,0.32);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:20;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .panel{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:var(--surface);box-shadow:-8px 0 28px rgba(16,27,45,0.12);transform:translateX(100%);transition:transform .22s ease;z-index:21;display:flex;flex-direction:column;}
  .panel.open{transform:translateX(0);}
  .panel-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);}
  .panel-close{float:right;border:none;background:none;font-size:20px;color:var(--ink-soft);cursor:pointer;line-height:1;padding:2px;}
  .panel-bl{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;}
  .panel-body{padding:18px 22px;overflow-y:auto;flex:1;}
  .panel-route{margin-bottom:22px;}
  .panel-route .track{height:22px;} .panel-route .track-mover{font-size:16px;top:-4px;}
  .field-group{margin-bottom:18px;}
  .field-group h4{font-family:'Space Grotesk',sans-serif;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:0 0 8px;font-weight:600;}
  .field-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #F0F2F4;}
  .field-row dt{color:var(--ink-soft);} .field-row dd{margin:0;font-weight:500;text-align:right;}
  .field-row dd.mono{font-family:'IBM Plex Mono',monospace;font-weight:500;}
  .panel-actions{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:8px;}
  .panel-actions button{flex:1;border:none;border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;background:var(--ink);color:#fff;}
  .panel-actions button.danger{background:var(--red-bg);color:var(--red);}
  .panel-actions button:disabled{background:var(--line);color:var(--ink-soft);cursor:default;}
  .modal-scrim{position:fixed;inset:0;background:rgba(16,27,45,0.32);opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:30;display:flex;align-items:center;justify-content:center;}
  .modal-scrim.open{opacity:1;pointer-events:auto;}
  .modal{background:var(--surface);border-radius:14px;width:480px;max-width:92vw;max-height:86vh;overflow-y:auto;padding:24px 26px;transform:scale(.96);opacity:0;transition:all .18s ease;}
  .modal-scrim.open .modal{transform:scale(1);opacity:1;}
  .modal h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 4px;}
  .modal .hint{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .modal label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-bottom:5px;margin-top:14px;}
  .modal input, .modal select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:7px;font-family:'Inter',sans-serif;font-size:13.5px;outline:none;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .mode-toggle{display:flex;gap:8px;margin-top:14px;}
  .mode-toggle button{flex:1;padding:9px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink-soft);}
  .mode-toggle button.active[data-m="sea"]{background:var(--sea-bg);border-color:var(--sea);color:var(--sea);}
  .mode-toggle button.active[data-m="air"]{background:var(--air-bg);border-color:var(--air);color:var(--air);}
  .modal-sub{display:none;} .modal-sub.show{display:block;}
  .modal-submit{width:100%;margin-top:22px;background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px;font-family:'Inter',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
  .modal-close{float:right;border:none;background:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .form-error{color:var(--red);font-size:12px;margin-top:10px;display:none;}
  @media (max-width:640px){ .row{grid-template-columns:1fr;} .row-status{align-items:flex-start;flex-direction:row;justify-content:space-between;} }
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">BL</div>
      <div>
        <h1>BL Tracking <span class="live-dot">live backend</span></h1>
        <div class="subtitle">Connected to the real FastAPI + SQLite backend on this machine</div>
      </div>
    </div>
    <button class="new-btn" onclick="openCreate()">+ New BL / AWB</button>
  </div>

  <div class="stats">
    <div class="stat booked"><div class="num" id="stat-booked">–</div><div class="lbl">Booked</div></div>
    <div class="stat transit"><div class="num" id="stat-transit">–</div><div class="lbl">In transit</div></div>
    <div class="stat arrived"><div class="num" id="stat-arrived">–</div><div class="lbl">Arrived</div></div>
    <div class="stat delivered"><div class="num" id="stat-delivered">–</div><div class="lbl">Delivered</div></div>
  </div>

  <div class="filters">
    <select id="f-mode" onchange="fetchList()">
      <option value="">All modes</option><option value="sea">Sea</option><option value="air">Air</option>
    </select>
    <select id="f-direction" onchange="fetchList()">
      <option value="">All directions</option><option value="import">Import</option><option value="export">Export</option>
    </select>
    <select id="f-status" onchange="fetchList()">
      <option value="">All statuses</option><option value="booked">Booked</option><option value="in_transit">In transit</option>
      <option value="arrived">Arrived</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option>
    </select>
    <input id="f-search" type="text" placeholder="Search BL / AWB number…" oninput="debouncedFetch()">
  </div>

  <div class="list" id="list"><div class="loading">Loading shipments…</div></div>
</div>

<div class="scrim" id="scrim" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <button class="panel-close" onclick="closePanel()">&times;</button>
    <div class="panel-bl" id="p-bl"></div>
    <div class="subtitle" id="p-carrier"></div>
  </div>
  <div class="panel-body" id="p-body"></div>
  <div class="panel-actions" id="p-actions"></div>
</div>

<div class="modal-scrim" id="modal-scrim">
  <div class="modal">
    <button class="modal-close" onclick="closeCreate()">&times;</button>
    <h2>New BL / AWB</h2>
    <div class="hint">This calls <code>POST /bl</code> on the real backend.</div>

    <div class="mode-toggle">
      <button type="button" class="active" data-m="sea" onclick="setMode('sea')">Sea</button>
      <button type="button" data-m="air" onclick="setMode('air')">Air</button>
    </div>

    <label>BL / AWB number</label>
    <input id="c-blnum" placeholder="e.g. MSCU7741205">

    <div class="modal-grid">
      <div><label>Direction</label>
        <select id="c-direction"><option value="import">Import</option><option value="export">Export</option></select>
      </div>
      <div><label>Carrier</label><input id="c-carrier" placeholder="e.g. MSC"></div>
    </div>
    <div class="modal-grid">
      <div><label>Shipper</label><input id="c-shipper" placeholder="Acme Exports"></div>
      <div><label>Consignee</label><input id="c-consignee" placeholder="Acme Imports"></div>
    </div>
    <div class="modal-grid">
      <div><label>Origin</label><input id="c-origin" placeholder="CNSHA — Shanghai"></div>
      <div><label>Destination</label><input id="c-dest" placeholder="PKKHI — Karachi"></div>
    </div>

    <div class="modal-sub show" id="sub-sea">
      <div class="modal-grid">
        <div><label>Vessel name</label><input id="c-vessel" placeholder="MSC Anna"></div>
        <div><label>Voyage number</label><input id="c-voyage" placeholder="V123"></div>
      </div>
    </div>
    <div class="modal-sub" id="sub-air">
      <label>Flight number</label><input id="c-flight" placeholder="EK601">
    </div>

    <div class="form-error" id="c-error"></div>
    <button class="modal-submit" onclick="submitCreate()">Create BL record</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = "";  // same origin — no CORS needed
let selectedMode = 'sea';
let panelId = null;
let searchTimer = null;

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(()=> t.className='toast', 2200);
}

function debouncedFetch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(fetchList, 300);
}

const modeIcon = {sea:"🚢", air:"✈️"};
function progressPct(status){
  return {booked:4, in_transit:50, arrived:92, delivered:100, cancelled:30}[status] || 0;
}
function routeHTML(s){
  const pct = progressPct(s.status);
  const cancelled = s.status === "cancelled" ? "cancelled" : "";
  return `<div class="track ${cancelled}">
    <div class="track-line"></div>
    <div class="track-fill ${s.mode}" style="width:${pct}%"></div>
    <div class="track-dot origin"></div><div class="track-dot dest"></div>
    <div class="track-mover" style="left:${pct}%">${modeIcon[s.mode]}</div>
  </div>`;
}
function fmtDate(iso){
  if(!iso) return "—";
  return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function shortLoc(loc){ return (loc||"").split(' — ')[0]; }

async function fetchList(){
  const params = new URLSearchParams();
  const mode = document.getElementById('f-mode').value;
  const direction = document.getElementById('f-direction').value;
  const status = document.getElementById('f-status').value;
  const q = document.getElementById('f-search').value;
  if(mode) params.set('mode', mode);
  if(direction) params.set('direction', direction);
  if(status) params.set('status', status);
  if(q) params.set('bl_number', q);
  params.set('page_size', '100');

  const list = document.getElementById('list');
  try{
    const resp = await fetch(`${API}/bl?${params.toString()}`);
    if(!resp.ok) throw new Error(`Server returned ${resp.status}`);
    const data = await resp.json();
    renderList(data.items);
    updateStats(data.items, status);
  }catch(err){
    list.innerHTML = `<div class="empty">Couldn't reach the backend: ${err.message}. Is <code>python main.py</code> running?</div>`;
  }
}

async function updateStats(currentItems, activeStatusFilter){
  // If a status filter is active, fetch unfiltered counts separately so the
  // stat pills always reflect the whole dataset, not just the current view.
  let items = currentItems;
  if(activeStatusFilter){
    const resp = await fetch(`${API}/bl?page_size=500`);
    items = (await resp.json()).items;
  }
  document.getElementById('stat-booked').textContent = items.filter(s=>s.status==='booked').length;
  document.getElementById('stat-transit').textContent = items.filter(s=>s.status==='in_transit').length;
  document.getElementById('stat-arrived').textContent = items.filter(s=>s.status==='arrived').length;
  document.getElementById('stat-delivered').textContent = items.filter(s=>s.status==='delivered').length;
}

function renderList(items){
  const list = document.getElementById('list');
  if(items.length===0){
    list.innerHTML = `<div class="empty">No shipments yet. Click "+ New BL / AWB" to create one.</div>`;
    return;
  }
  list.innerHTML = items.map(s=>`
    <div class="row" tabindex="0" onclick="openPanel(${s.id})" onkeydown="if(event.key==='Enter')openPanel(${s.id})">
      <div class="row-id">
        <div class="bl-num">${s.bl_number}</div>
        <div class="row-meta"><span class="mode-chip ${s.mode}">${s.mode}</span><span>${s.direction}</span></div>
        <div class="row-meta">${s.carrier_name}</div>
      </div>
      <div class="route">
        <div class="route-labels"><b>${shortLoc(s.origin_location)}</b><b>${shortLoc(s.destination_location)}</b></div>
        ${routeHTML(s)}
      </div>
      <div class="row-status">
        <span class="badge ${s.status}">${s.status.replace('_',' ')}</span>
        <span class="transit-label">${s.transit_label}</span>
      </div>
    </div>
  `).join('');
}

async function openPanel(id){
  panelId = id;
  const resp = await fetch(`${API}/bl/${id}`);
  const s = await resp.json();

  document.getElementById('p-bl').textContent = s.bl_number;
  document.getElementById('p-carrier').textContent = `${s.carrier_name} · ${s.mode.toUpperCase()} · ${s.direction}`;
  document.getElementById('p-body').innerHTML = `
    <div class="panel-route">
      <div class="route-labels"><b>${s.origin_location}</b></div>
      ${routeHTML(s)}
      <div class="route-labels" style="margin-top:4px;justify-content:flex-end;"><b>${s.destination_location}</b></div>
    </div>
    <div class="field-group"><h4>Parties</h4>
      <div class="field-row"><dt>Shipper</dt><dd>${s.shipper_name}</dd></div>
      <div class="field-row"><dt>Consignee</dt><dd>${s.consignee_name}</dd></div>
    </div>
    ${s.mode==='sea' ? `
    <div class="field-group"><h4>Sea details</h4>
      <div class="field-row"><dt>Vessel</dt><dd>${s.vessel_name||'—'}</dd></div>
      <div class="field-row"><dt>Voyage</dt><dd class="mono">${s.voyage_number||'—'}</dd></div>
      <div class="field-row"><dt>Containers</dt><dd class="mono">${s.container_numbers||'—'}</dd></div>
    </div>` : `
    <div class="field-group"><h4>Air details</h4>
      <div class="field-row"><dt>Flight</dt><dd class="mono">${s.flight_number||'—'}</dd></div>
    </div>`}
    <div class="field-group"><h4>Schedule</h4>
      <div class="field-row"><dt>ETD</dt><dd class="mono">${fmtDate(s.etd)}</dd></div>
      <div class="field-row"><dt>ATD</dt><dd class="mono">${fmtDate(s.atd)}</dd></div>
      <div class="field-row"><dt>ETA</dt><dd class="mono">${fmtDate(s.eta)}</dd></div>
      <div class="field-row"><dt>ATA</dt><dd class="mono">${fmtDate(s.ata)}</dd></div>
    </div>
    <div class="field-group"><h4>Cargo</h4>
      <div class="field-row"><dt>Packages</dt><dd>${s.package_count ?? '—'}</dd></div>
      <div class="field-row"><dt>Gross weight</dt><dd>${s.gross_weight_kg ?? '—'} kg</dd></div>
      <div class="field-row"><dt>Volume</dt><dd>${s.volume_cbm ?? '—'} CBM</dd></div>
    </div>
  `;

  const actions = document.getElementById('p-actions');
  const nextStatus = {booked:"in_transit", in_transit:"arrived", arrived:"delivered"}[s.status];
  const nextLabel = {in_transit:"Mark in transit", arrived:"Mark arrived", delivered:"Mark delivered"}[nextStatus];
  let html = nextStatus
    ? `<button onclick="advance(${s.id}, '${nextStatus}')">${nextLabel}</button>`
    : `<button disabled>No further transitions</button>`;
  if(s.status === 'booked'){
    html += `<button class="danger" onclick="removeBl(${s.id})">Delete</button>`;
  }
  actions.innerHTML = html;

  document.getElementById('panel').classList.add('open');
  document.getElementById('scrim').classList.add('open');
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('scrim').classList.remove('open');
}

async function advance(id, nextStatus){
  const body = {status: nextStatus};
  if(nextStatus === 'in_transit') body.atd = new Date().toISOString();
  if(nextStatus === 'arrived') body.ata = new Date().toISOString();

  const resp = await fetch(`${API}/bl/${id}/status`, {
    method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if(!resp.ok){
    const err = await resp.json().catch(()=>({detail: resp.statusText}));
    toast(err.detail || 'Could not update status', true);
    return;
  }
  toast(`Status updated to ${nextStatus.replace('_',' ')}`);
  await fetchList();
  openPanel(id);
}

async function removeBl(id){
  const resp = await fetch(`${API}/bl/${id}`, {method:'DELETE'});
  if(resp.status === 204){
    toast('Deleted');
    closePanel();
    fetchList();
  }else{
    const err = await resp.json().catch(()=>({detail: resp.statusText}));
    toast(err.detail || 'Could not delete', true);
  }
}

function setMode(m){
  selectedMode = m;
  document.querySelectorAll('.mode-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  document.getElementById('sub-sea').classList.toggle('show', m==='sea');
  document.getElementById('sub-air').classList.toggle('show', m==='air');
}
function openCreate(){
  document.getElementById('c-error').style.display = 'none';
  document.getElementById('modal-scrim').classList.add('open');
}
function closeCreate(){ document.getElementById('modal-scrim').classList.remove('open'); }

async function submitCreate(){
  const errorEl = document.getElementById('c-error');
  errorEl.style.display = 'none';

  const payload = {
    bl_number: document.getElementById('c-blnum').value.trim(),
    mode: selectedMode,
    direction: document.getElementById('c-direction').value,
    carrier_name: document.getElementById('c-carrier').value.trim(),
    shipper_name: document.getElementById('c-shipper').value.trim(),
    consignee_name: document.getElementById('c-consignee').value.trim(),
    origin_location: document.getElementById('c-origin').value.trim(),
    destination_location: document.getElementById('c-dest').value.trim(),
    vessel_name: selectedMode==='sea' ? (document.getElementById('c-vessel').value.trim() || null) : null,
    voyage_number: selectedMode==='sea' ? (document.getElementById('c-voyage').value.trim() || null) : null,
    flight_number: selectedMode==='air' ? (document.getElementById('c-flight').value.trim() || null) : null,
  };

  if(!payload.bl_number || !payload.carrier_name || !payload.shipper_name ||
     !payload.consignee_name || !payload.origin_location || !payload.destination_location){
    errorEl.textContent = 'Please fill in all required fields.';
    errorEl.style.display = 'block';
    return;
  }

  const resp = await fetch(`${API}/bl`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
  });
  if(!resp.ok){
    const err = await resp.json().catch(()=>({detail: resp.statusText}));
    errorEl.textContent = typeof err.detail === 'string' ? err.detail : 'Could not create BL record.';
    errorEl.style.display = 'block';
    return;
  }
  closeCreate();
  toast('BL record created');
  fetchList();
}

fetchList();
</script>
</body>
</html>
